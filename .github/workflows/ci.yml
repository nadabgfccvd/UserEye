# CI do repositório UserEye — adaptado do ci.yml original do pacote
# (src/usereye/.github/workflows/ci.yml) para o layout pós-reorganização:
# o pacote vive em src/usereye/, então todos os jobs usam
# defaults.run.working-directory e caminhos de cache/artefatos ajustados.
# Adaptado em 2026-10-10 (roadmap M1, issue #1).

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: src/usereye

jobs:
  # Static quality gates + browser-free unit tests. Fast, runs on every PR.
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported Node lines, matching engines.node ">=20.11".
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - name: Lint (eslint flat config, item 5.1)
        run: npm run lint
      - name: Format check (prettier, item 5.1)
        run: npm run format:check
      - name: Typecheck declarations (tsc, items 0.3/2.2)
        run: npm run typecheck
      - name: Consistency checks (version/API/README/Playwright/package/deps/generated docs)
        run: npm run checks
      - name: Doctor preflight (must run without browsers installed)
        run: node bin/usereye.js doctor --json || true
      - name: Unit tests (browser suites skip without engines)
        run: npm test
        env:
          USEREYE_SKIP_BROWSER_TESTS: '1'
      - name: Coverage gate — non-engine floors (item 1.4)
        run: npm run test:coverage
        env:
          USEREYE_SKIP_BROWSER_TESTS: '1'
          USEREYE_COVERAGE_ALLOW_SKIPPED_ENGINE: '1'

  # Full engine suite on chromium + the complete coverage gate.
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage table comment (7.5.1, item 1.5)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full test suite (engine integration, item 1.2)
        run: npm test
      - name: Coverage gate — all floors incl. engine aggregate >= 40% (item 1.4)
        run: npm run test:coverage
        env:
          USEREYE_COVERAGE_MARKDOWN: coverage-summary.md
      # 7.5.1 (roadmap 7.5.0 item 1.5): the coverage table lands in the job summary,
      # and on pull requests as a sticky comment — no third-party action needed.
      - name: Coverage table → job summary
        if: always()
        run: test -f coverage-summary.md && cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Coverage table → PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const covPath = 'src/usereye/coverage-summary.md';
            if (!fs.existsSync(covPath)) return;
            const marker = '<!-- usereye-coverage -->';
            const body = `${marker}\n${fs.readFileSync(covPath, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The acceptance suite runs on all three engines, not just chromium.
  acceptance-browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Engine lifecycle on ${{ matrix.browser }}
        run: npm run test:engine
        env:
          USEREYE_BROWSER: ${{ matrix.browser }}
      - name: Start fixture
        run: |
          node tests/fixture-server.js spa > fixture.log 2>&1 &
          for n in {1..50}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .2; done
          cat fixture.log; exit 1
      - name: Quick run on ${{ matrix.browser }} (vitals recorded in result.json)
        run: >-
          node bin/usereye.js auto --url http://127.0.0.1:4173 --mode quick
          --browser ${{ matrix.browser }} --out artifacts/${{ matrix.browser }}
          --no-video --no-code-quality --timings
      - name: Assert vitals were recorded
        run: |
          node -e "
            const r = require('./artifacts/${{ matrix.browser }}/result.json');
            if (!r.performance || !r.performance.metrics) { console.error('no performance block'); process.exit(1); }
            if (!r.commandAudit) { console.error('no commandAudit block'); process.exit(1); }
            console.log('vitals:', JSON.stringify(r.performance.metrics.lcp));
          "
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usereye-acceptance-${{ matrix.browser }}
          path: src/usereye/artifacts/${{ matrix.browser }}

  # Real quick-mode runs against every fixture family, artifacts uploaded.
  fixture-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [static, spa, english, portuguese, sso]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start fixture
        run: |
          node tests/fixture-server.js "${{ matrix.fixture }}" > fixture.log 2>&1 &
          echo $! > fixture.pid
          for n in {1..50}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .2; done
          cat fixture.log; exit 1
      - name: Quick UserEye run
        run: >-
          node bin/usereye.js auto --url http://127.0.0.1:4173
          --project tests/fixtures/${{ matrix.fixture }} --mode quick
          --out artifacts/${{ matrix.fixture }} --no-video --no-code-quality
          --report-format html,md,sarif
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usereye-${{ matrix.fixture }}
          path: src/usereye/artifacts/${{ matrix.fixture }}

  # Prove the code-execution boundary holds on a real, hostile fixture — a repo
  # whose npm scripts try to write a marker file.
  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - name: Boundary unit tests
        run: node --test tests/code-execution-boundary.test.js
      - name: No shell:true anywhere in the shipped code
        run: |
          if grep -rnE "shell:[[:space:]]*(true|process\.platform)" --include='*.js' . \
             | grep -v node_modules | grep -v '/tests/'; then
            echo "::error::shell: true (or a shell: process.platform conditional) reintroduced — see SECURITY.md, the boundary forbids it."
            exit 1
          fi
          echo "OK — no shell:true (nor shell conditionals) in shipped code."
      - name: A hostile project is analysed without executing its scripts
        run: |
          mkdir -p /tmp/hostile
          cat > /tmp/hostile/package.json <<'JSON'
          { "name": "hostile", "version": "1.0.0",
            "scripts": { "lint": "touch /tmp/hostile/PWNED", "typecheck": "touch /tmp/hostile/PWNED" } }
          JSON
          echo "module.exports = 1;" > /tmp/hostile/index.js
          node bin/usereye.js auto --project /tmp/hostile --dry-run --out /tmp/hostile-artifacts
          if [[ -e /tmp/hostile/PWNED ]]; then
            echo "::error::the target repository executed code without authorization."
            exit 1
          fi
          echo "OK — target scripts were not executed."

  # Nightly: all three browser engines, perf benchmark and a standard-mode
  # soak run. The benchmark compares against the committed baseline with
  # +50% tolerance; runner variance is why it never gates PRs.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/usereye/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Multi-browser engine lifecycle
        run: npm run test:engine
      - name: Performance benchmark vs. baseline
        run: npm run test:benchmark
      - name: Start nightly fixture
        run: |
          node tests/fixture-server.js spa > fixture.log 2>&1 &
          for n in {1..50}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .2; done
          cat fixture.log; exit 1
      - name: Standard-mode soak run
        run: >-
          node bin/usereye.js auto --url http://127.0.0.1:4173 --mode standard
          --out artifacts/nightly --no-video --no-code-quality
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usereye-nightly
          path: src/usereye/artifacts/nightly
