<!doctype html><html lang="en"><meta charset="utf-8"><title>SSO Workspace</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto}button,input{padding:10px}.wall,.app{border:1px solid #ccd3df;border-radius:12px;padding:24px}</style><main id="root"></main><script>const root=document.querySelector('#root');if(localStorage.getItem('fixture-auth')==='yes'){root.innerHTML='<section class="app"><h1>Authenticated workspace</h1><nav><button>Open profile</button><button>Search</button></nav><p>Single sign-on state accepted.</p></section>'}else{root.innerHTML='<section class="wall"><h1>Sign in with your identity provider</h1><label>Account <input autocomplete="username"></label><label>Passcode <input type="password"></label><button>Continue with SSO</button></section>'}</script></html>
