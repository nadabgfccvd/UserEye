<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hash Workspace</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:16px}nav{display:flex;gap:10px}button,a,input{padding:10px;margin:4px}.panel{border:1px solid #ccd3df;border-radius:10px;padding:20px}</style><body><nav><a href="#/">Home</a><a href="#/login">Sign in</a><a href="#/items">Items</a></nav><main id="app"></main><script>const app=document.querySelector('#app');function draw(){const route=location.hash||'#/';if(route==='#/login'){app.innerHTML='<section class="panel"><h1>Sign in</h1><form id="login"><label>Email <input type="email" name="email" required></label><label>Password <input type="password" name="password" required></label><button type="submit">Sign in</button><button type="button">Cancel</button></form></section>';document.querySelector('#login').onsubmit=e=>{e.preventDefault();setTimeout(()=>{sessionStorage.ok='1';location.hash='#/items'},250)}}else if(route==='#/items'){app.innerHTML='<section class="panel"><h1>Workspace items</h1><ul><li>Alpha</li><li>Beta</li></ul><button>Add item</button><button class="danger">Delete forever</button></section>'}else app.innerHTML='<section class="panel"><h1>Hash Workspace</h1><p>A small client-side router.</p><a href="#/items">Open workspace</a></section>'}addEventListener('hashchange',draw);draw();</script></body></html>
